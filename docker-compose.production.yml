services:
  olivia-one-front:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in .env.production}
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-https://one.o7digitalgroup.com}
    networks:
      mailcow:
        aliases:
          - olivia-one-front

  olivia-gateway:
    restart: unless-stopped
    build:
      context: ./olivia-gateway
      dockerfile: Dockerfile
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-https://one.o7digitalgroup.com}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mailcow-imap}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-mail.o7digitalgroup.com}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_SECURE: ${MAIL_IMAP_SECURE:-true}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mail.o7digitalgroup.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-python-olivia}
      AI_API_URL: ${AI_API_URL:?Set AI_API_URL in .env.production}
      AI_DEFAULT_CLIENT_CODE: ${AI_DEFAULT_CLIENT_CODE:-default}
      AI_MAILBOX_CLIENT_MAP: ${AI_MAILBOX_CLIENT_MAP:-{}}
      AI_DOMAIN_CLIENT_MAP: ${AI_DOMAIN_CLIENT_MAP:-{}}
      OLIVIA_INTERNAL_TOKEN: ${OLIVIA_INTERNAL_TOKEN:?Set OLIVIA_INTERNAL_TOKEN in .env.production}
      PULSE_CRM_API_URL: ${PULSE_CRM_API_URL:-}
      PULSE_CRM_INTEGRATION_SECRET: ${PULSE_CRM_INTEGRATION_SECRET:-CHANGE_ME}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Olivier Steineur}
      COOKIE_SECRET: ${COOKIE_SECRET:-CHANGE_ME}
      PORT: ${PORT:-8787}
      HOST: ${HOST:-0.0.0.0}
      TASK_DATA_PATH: /data/tasks.json
    volumes:
      - olivia-task-data:/data
    networks:
      mailcow:
        aliases:
          - olivia-gateway
      olivia-ai-network:
        aliases:
          - olivia-gateway

  olivia-ai-python:
    restart: unless-stopped
    build:
      context: ../suitesmine-bot
      dockerfile: Dockerfile.python
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-5.6-luna}
      OPENAI_MODEL_BALANCED: ${OPENAI_MODEL_BALANCED:-gpt-5.6-terra}
      OPENAI_MODEL_POWERFUL: ${OPENAI_MODEL_POWERFUL:-gpt-5.6-sol}
      OPENAI_VECTOR_STORES_JSON: ${OPENAI_VECTOR_STORES_JSON:-{}}
      OLIVIA_WEB_SEARCH_ENABLED: ${OLIVIA_WEB_SEARCH_ENABLED:-true}
      OLIVIA_MAX_TOOL_ROUNDS: ${OLIVIA_MAX_TOOL_ROUNDS:-3}
      OLIVIA_INTERNAL_TOKEN: ${OLIVIA_INTERNAL_TOKEN:?Set OLIVIA_INTERNAL_TOKEN in .env.production}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      olivia-ai-network:
        aliases:
          - olivia-ai-python

networks:
  mailcow:
    external: true
    name: ${MAILCOW_NETWORK:-mailcowdockerized_mailcow-network}
  olivia-ai-network:
    name: olivia-ai-network

volumes:
  olivia-task-data:
