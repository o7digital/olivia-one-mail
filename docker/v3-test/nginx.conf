server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /v3-test/api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $test_gateway olivia-one-v3-test-gateway:8787;
    rewrite ^/v3-test(/api/.*)$ $1 break;
    proxy_pass http://$test_gateway;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /v3-test/ {
    try_files $uri $uri/ /v3-test/index.html;
    add_header Cache-Control "no-store" always;
  }
  location / { return 404; }
}
