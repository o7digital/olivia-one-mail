# Inside the existing Olivia One frontend server block. No Mailcow config changes.
location = /v3-test { return 302 /v3-test/; }
location ^~ /v3-test/ {
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $olivia_test_front olivia-one-v3-test-front:80;
  proxy_pass http://$olivia_test_front;
  proxy_set_header Host $host;
  proxy_read_timeout 120s;
}
